<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>

    </style>

</head>

<body>
    <h4>Envie uma Mensagem Preenchendo o Formulário abaixo:</h4>
    <form action="">

    <label for="nome">Nome</label>
    <input type="text" id="nome" class="nome" placeholder="Digite seu Nome">
    
    <br><br>
    <label for="contato">Telefone</label>
    <input type="tel" name="contato" class="contato" id="contato" placeholder="Digite seu Telefone">

    <br><br>
    <label for="email">E-mail</label>
    <input type="email" class="email" id="email" placeholder="Digite seu E-Mail">

    <br><br>
    Deseja Receber Nossas Novidades? 
    <label for="sim">Sim</label>
    <input type="radio" id="sim" class="sim" value="sim" name="opc">
    <label for="nao">Não</label>
    <input type="radio" id="nao" class="nao" value="nao" name="opc">

    <br><br>
    <label for="mensagem">Sua Mensagem:</label>
    <textarea name="mensagem" id="mensagem" rows="3" cols="30"
              placeholder="Digite sua Mensagem Aqui..."></textarea>

    <br><br>
    <input type="submit" value="Enviar">

    <br><br>
    </form>
</body>

</html>
