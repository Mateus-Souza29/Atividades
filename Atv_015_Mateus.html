<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

</head>

<body>
    <form action="">

        <label for="nome">Insira seu Nome Completo:</label>
        <br>
        <input type="text" name="nome" id="nome" class="nome" placeholder="Insira seu Nome...">

        <br><br>
        <label for="senha">Insira sua Senha:</label>
        <br>
        <input type="password" name="senha" id="senha" class="senha" placeholder="Insira sua Senha...">

        <br><br>
        <label for="email">Insira seu E-mail:</label>
        <br>
        <input type="email" name="email" id="email" class="email" placeholder="Insira seu E-mail...">

        <br><br>
        <label for="date">Insira sua Data de Nascimento:</label>
        <br>
        <input type="date" name="date" id="date" class="date">

    </form>


</body>

</html>
