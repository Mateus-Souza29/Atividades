<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        
        fieldset{
            display: flex;
            flex-direction: column;
            max-width: 300px;
            padding: 12px;
            position: relative;
            left: 240px;
            gap: 10px;
            border: 0px;
        }

        img{
				display: block;
				margin-left: auto;
				margin-right: auto;
				width: 15%	
			}	

        h1{
            text-align: center;
        }

        body{
            background: linear-gradient(rgb(72, 74, 209), rgb(148, 3, 59));
            height: 928px;
        }

        input, select{
            height: 20px;
            border-radius: 15px;
        }

        button{
            height: 30px;
            border-radius: 15px;
            background-color: yellow;
        }

        label{
            color: white;
        }


    </style>

</head>

<body>

    <img src="/fox.png" alt="Fox">
    <h1>Requisitos de Cadastro</h1>
    <form action="https://sheetdb.io/api/v1/a6n3u6kfk4fxd" 
          method="post">

        <fieldset>
            
        <legend></legend>

            <label for="nome">Nome:</label>
            <input type="text" name="data[nome]" id="nome">

            <label for="sbnome">Sobrenome:</label>
            <input type="text" name="data[sbnome]" id="sbnome">

            <label for="uf">Estado:</label>
            <select name="data[uf]" id="uf">
                <option value="" disabled selected><b>Selecione uma Opção</b></option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>         
                <option value="MG">Minas Gerais</option>                    
                <option value="RJ">Rio de Janeiro</option>
                <option value="SP">São Paulo</option>
            </select>

            <label for="cidade">Cidade:</label>
            <input type="text" name="data[cidade]" id="cidade">

            <br>
            <button type="submit"><b>ENVIAR DADOS</b></button>

        </fieldset>

    </form>
    

</body>

</html>
