<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Elaborado</title>

    <style>
        
        body{
            background-image: url(/Informatica.jpg);
            background-repeat: no-repeat;
			background-attachment: fixed;
			background-size: cover;
            color: white;
            margin: 0;
            min-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form{
            
        }

        fieldset{
            border: 0px;
            background-color: rgba(0, 0, 0, 0.527);
            text-align: left;
            border-radius: 20px;
            max-width: 600px;
            padding: 0px;
            margin: auto;

        }

        legend{
            background-color: blue;
            width: 600px;
            height: 60px;
            font-size: 40px;
            text-align: center;
            border-radius: 20px;
        }

       label[for="name"],
        label[for="empresa"],
        label[for="email"],
        label[for="ass"],
        label[for="contato"],
        label[for="gen"] {
            display: inline-block;
            width: 150px;
            padding-left: 20px;
            box-sizing: border-box;
        }

        #name,
        #last {
            width: 200px;
        }

        #empresa,
        #email{
            width: 412px;
        }

        #gen {
            width: 420px;
        }

        #ass {
            width: 415px;
            vertical-align: top;
        }

        #ddd {
            width: 100px;
        }

        #tel {
            width: 300px;
        }

        #submit {
            color: white;
            background-color: blue;
            width: 100px;
            height: 40px;
            border-radius: 20px;
        }

    </style>

</head>

<body>

    <form action="https://sheetdb.io/api/v1/x3ur2io9342jk" method="post" id="meuform">

        <fieldset>

            <legend>Formulário de Cadastro</legend>
        
        <br>
        <label for="name">Nome e Sobrenome:</label>
        <input type="text" name="data[name]" id="name" placeholder="Nome...">
        <input type="text" name="data[last]" id="last" placeholder="Sobrenome...">

        <br><br>
        <label for="empresa">Empresa:</label>
        <input type="text" class="empresa" id="empresa" name="data[empresa]">

        <br><br>
        <label for="email">E-mail:</label>
        <input type="email" class="email" id="email" placeholder="Ex: e-mail@gmail.com" name="data[email]">

        <br><br>
        <label for="ass">Assunto:</label>
             <textarea name="data[ass]" id="ass" rows="5" cols="66"
              placeholder="Digite o Assunto Aqui..."></textarea>

        <br><br>
        <label for="contato">Telefone:</label>
        <input type="ddd" name="data[ddd]" class="contato" id="ddd" placeholder="DDD">
        <input type="tel" name="data[tel]" class="contato" id="tel" placeholder="Número">

        <br><br>
        <label for="gen">Gênero:</label>
            <select name="data[gen]" id="gen">
                <option value="" disabled selected>Selecione Uma Opção</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>                          
            </select>

        <br><br>Você Está Começando na Programação? <br>
        <input type="radio" id="data[sim]" class="sim" value="Sim" name="data[ini]">
        <label for="sim">Sim</label>
        <input type="radio" id="data[nao]" class="nao" value="Nao" name="data[ini]">
        <label for="nao">Não</label>

        <br><br>
        <input type="submit" value="Enviar" id="submit">

        </fieldset>

    </form>

    <script>
        document.getElementById("meuform"),addEventListener("submit",function(event){
            event.preventDefault();
            alert('Dados Enviados com Sucesso!');

            window.location.href= 'Atv_022_Mateus.html';
        });
    </script>
    
</body>

</html>
